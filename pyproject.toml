[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoptcomec"
dynamic = ["version"]
description = "Interactive topology optimization for compliant mechanisms"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Luc Prevost"}]
keywords = ["topology-optimization", "compliant-mechanisms", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pyvista>=0.49.1",
    "pyvistaqt>=0.13.1",
    "vtk>=9.7.1",
    "numpy-stl>=4.1.3",
    # lib3mf publishes wheels for these platforms only (no sdist): elsewhere
    # the package installs without it and 3MF export reports a clear error.
    "lib3mf>=2.5.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/ninja7v/topoptcomec"
Repository = "https://github.com/ninja7v/topoptcomec.git"
Documentation = "https://github.com/ninja7v/topoptcomec/wiki"
Issues = "https://github.com/ninja7v/topoptcomec/issues"

[project.scripts]
topoptcomec = "topoptcomec.__main__:main"

[tool.setuptools.packages.find]
include = ["topoptcomec*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "topoptcomec.version.__version__"}

[tool.setuptools.package-data]
topoptcomec = ["icons/*", "presets.json"]
