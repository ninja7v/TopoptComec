name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff lizard

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Lizard (complexity & length)
        run: lizard -L 150 -C 30 -w topoptcomec tests

  tests:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        include:
          # 3.15 is experimental: VTK 9.7.1 has no cp315 wheels yet.
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: ${{ matrix.experimental || false }}

      - name: Install system dependencies
        run: |
          sudo grep -Rl "packages.microsoft.com" /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libxkbcommon-x11-0

      - name: Install Python dependencies
        if: ${{ !matrix.experimental }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Install Python dependencies (3.15 core stack)
        if: ${{ matrix.experimental }}
        run: |
          python -m pip install --upgrade pip
          pip install "pyside6>=6.12.0" "numpy>=2.5.4" "scipy>=1.18.1"
          pip install --no-deps -e .
          pip install pytest pytest-cov

      - name: Run tests
        if: ${{ !matrix.experimental }}
        run: |
          pytest -W error --cov=topoptcomec --cov-report=term-missing --cov-fail-under=80

      - name: Run core tests (3.15; VTK has no cp315 wheel yet)
        if: ${{ matrix.experimental }}
        run: |
          pytest -W error --cov=topoptcomec.core --cov-report=term-missing --cov-fail-under=80 \
            tests/test_numerics.py \
            tests/test_fem.py \
            tests/test_optimizers.py \
            tests/test_analyzers.py \
            tests/test_initializers.py \
            tests/test_displacements.py \
            tests/test_workers.py \
            tests/test_widgets.py \
            tests/test_main.py \
            --deselect tests/test_initializers.py::test_from_current_result_disabling_and_scaling
